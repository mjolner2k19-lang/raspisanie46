function render(){let t=nowMinsk();$('clock').textContent=t.time;calendar(t);const view=chosen===null?(t.day>4?0:t.day):chosen;const actual=view===t.day&&chosen===null&&!HOLIDAYS.some(h=>t.iso>=h.start&&t.iso<=h.end);const week=t.day>4&&chosen===null;const vacation=HOLIDAYS.some(h=>t.iso>=h.start&&t.iso<=h.end)&&chosen===null;const list=SCHEDULE[view];document.body.dataset.day=view;
$('days').innerHTML=DAYNAMES.map((d,i)=>'<button type="button" class="day '+(view===i?'active':'')+'" data-i="'+i+'" aria-label="'+d+'" aria-pressed="'+(view===i)+'">'+['Пн','Вт','Ср','Чт','Пт'][i]+'</button>').join('');document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{chosen=Number(b.dataset.i);render()});$('today').onclick=()=>{chosen=null;render()};$('heading').textContent='Уроки · '+DAYNAMES[view].toLowerCase();
let active=-1,firstUpcoming=-1;if(actual){for(let i=0;i<list.length;i++){if(t.mins>=toMinutes(list[i].start)&&t.mins<toMinutes(list[i].end))active=i;if(firstUpcoming===-1&&t.mins<toMinutes(list[i].start))firstUpcoming=i}}
let heroIndex=actual?(active>=0?active:firstUpcoming>=0?firstUpcoming:list.length-1):0;let item=list[heroIndex];$('daylabel').textContent=DAYNAMES[view];$('subject').textContent=item.subject;showTeacher(item.subject);$('heroIcon').innerHTML=lessonIcon(item.subject);$('start').textContent=item.start;$('room').textContent=item.room;$('roomwrap').style.display=item.room?'inline-flex':'none';let message='';
if(week)message='Первый урок в понедельник';else if(vacation)message='Сейчас каникулы';else if(!actual)message='Первый урок · '+item.start;else if(active>=0)message='До звонка: '+(toMinutes(item.end)-t.mins)+' мин';else if(firstUpcoming>=0)message='До урока: '+(toMinutes(item.start)-t.mins)+' мин';else message='Уроки на сегодня закончились';$('timertxt').textContent=message;const progress=actual&&active>=0?Math.max(0,Math.min(100,(t.mins-toMinutes(item.start))/(toMinutes(item.end)-toMinutes(item.start))*100)):0;$('progressFill').style.width=progress+'%';$('lessonProgress').setAttribute('aria-valuenow',Math.round(progress));
let nextIdx=heroIndex+1,nday=view;if(nextIdx>=list.length){nextIdx=0;nday=(view+1)%5}let next=SCHEDULE[nday][nextIdx];$('nextlabel').textContent=nday===view?'Следующий урок':'Следующий учебный день';$('nextname').textContent=next.subject;$('nextIcon').innerHTML=lessonIcon(next.subject);$('nextdetail').textContent=(nday===view?'':DAYNAMES[nday]+' · ')+next.start+' · '+next.room;
$('lessons').innerHTML=list.map((x,i)=>'<article class="lesson '+(actual&&i===active?'active':'')+'"><span class="num">'+x.num+'</span><span class="lesson-icon">'+lessonIcon(x.subject)+'</span><div><div class="name"></div><div class="hours">'+x.start+'–'+x.end+'</div></div><div class="room"></div></article>').join('');Array.from($('lessons').children).forEach((el,i)=>{el.querySelector('.name').textContent=list[i].subject;el.querySelector('.room').textContent=list[i].room});}
render();setInterval(render,15000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});
</script></body></html>
