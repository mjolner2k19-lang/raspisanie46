const days=(a,b)=>Math.round((ms(b)-ms(a))/86400000);
const short=s=>s.slice(8,10)+'.'+s.slice(5,7);
function dayWord(n){if(n%100>=11&&n%100<=14)return'дней';return n%10===1?'день':n%10>=2&&n%10<=4?'дня':'дней'}
function yearWord(n){if(n%100>=11&&n%100<=14)return'лет';return n%10===1?'год':n%10>=2&&n%10<=4?'года':'лет'}
function calendar(t){if(lastCalendar===t.iso)return;lastCalendar=t.iso;const icons={'Осенние':'🍁','Зимние':'❄️','Весенние':'🌷','Летние':'☀️'};let current=HOLIDAYS.find(h=>t.iso>=h.start&&t.iso<=h.end),next=HOLIDAYS.find(h=>t.iso<h.start);let h=current||next;
if(h){$('holidayicon').textContent=icons[h.name];let n=current?days(t.iso,h.back):days(t.iso,h.start);$('holidaytitle').textContent=current?'ДО ШКОЛЫ — '+n+' '+dayWord(n):'ДО '+({'Осенние':'ОСЕННИХ','Зимние':'ЗИМНИХ','Весенние':'ВЕСЕННИХ','Летние':'ЛЕТНИХ'}[h.name])+' КАНИКУЛ — '+n+' '+dayWord(n);$('holidaydate').textContent='с '+short(h.start)+' по '+short(h.end)+(current?' · В школу '+short(h.back):'');}else{$('holidayicon').textContent='☀️';$('holidaytitle').textContent='Хороших каникул!';$('holidaydate').textContent='До следующего учебного года'}
const y=Number(t.iso.slice(0,4));
const upcoming=BIRTHDAYS.map(x=>{let date=y+'-'+x.md;if(date<t.iso)date=(y+1)+'-'+x.md;return {...x,date,delta:days(t.iso,date),age:Number(date.slice(0,4))-x.year}})
 .filter(x=>x.delta>=0&&x.delta<=2)
 .sort((a,b)=>a.delta-b.delta);
$('birthday').hidden=upcoming.length===0;
if(upcoming.length){
 const person=upcoming[0];
 $('birthdayname').textContent=person.name;
 $('birthdaydesc').textContent=person.delta===0
  ?'Сегодня исполняется '+person.age+' '+yearWord(person.age)+' 🎉'
  : 'Через '+person.delta+' '+dayWord(person.delta)+' исполнится '+person.age+' '+yearWord(person.age);
}
return current}
function render(){let t=nowMinsk();$('clock').textContent=t.time;calendar(t);const view=chosen===null?(t.day>4?0:t.day):chosen;const actual=view===t.day&&chosen===null&&!HOLIDAYS.some(h=>t.iso>=h.start&&t.iso<=h.end);const week=t.day>4&&chosen===null;const vacation=HOLIDAYS.some(h=>t.iso>=h.start&&t.iso<=h.end)&&chosen===null;const list=SCHEDULE[view];document.body.dataset.day=view;
$('days').innerHTML=DAYNAMES.map((d,i)=>'<button type="button" class="day '+(view===i?'active':'')+'" data-i="'+i+'" aria-label="'+d+'" aria-pressed="'+(view===i)+'">'+['Пн','Вт','Ср','Чт','Пт'][i]+'</button>').join('');document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{chosen=Number(b.dataset.i);render()});$('today').onclick=()=>{chosen=null;render()};$('heading').textContent='Уроки · '+DAYNAMES[view].toLowerCase();
let active=-1,firstUpcoming=-1;if(actual){for(let i=0;i<list.length;i++){if(t.mins>=toMinutes(list[i].start)&&t.mins<toMinutes(list[i].end))active=i;if(firstUpcoming===-1&&t.mins<toMinutes(list[i].start))firstUpcoming=i}}
let heroIndex=actual?(active>=0?active:firstUpcoming>=0?firstUpcoming:list.length-1):0;let item=list[heroIndex];$('daylabel').textContent=DAYNAMES[view];$('subject').textContent=item.subject;$('start').textContent=item.start;$('room').textContent=item.room;$('roomwrap').style.display=item.room?'inline-flex':'none';let message='';
if(week)message='Первый урок в понедельник';else if(vacation)message='Сейчас каникулы';else if(!actual)message='Первый урок · '+item.start;else if(active>=0)message='До звонка: '+(toMinutes(item.end)-t.mins)+' мин';else if(firstUpcoming>=0)message='До урока: '+(toMinutes(item.start)-t.mins)+' мин';else message='Уроки на сегодня закончились';$('timertxt').textContent=message;
let nextIdx=heroIndex+1,nday=view;if(nextIdx>=list.length){nextIdx=0;nday=(view+1)%5}let next=SCHEDULE[nday][nextIdx];$('nextlabel').textContent=nday===view?'Следующий урок':'Следующий учебный день';$('nextname').textContent=next.subject;$('nextdetail').textContent=(nday===view?'':DAYNAMES[nday]+' · ')+next.start+' · '+next.room;
$('lessons').innerHTML=list.map((x,i)=>'<article class="lesson '+(actual&&i===active?'active':'')+'"><span class="num">'+x.num+'</span><div><div class="name"></div><div class="hours">'+x.start+'–'+x.end+'</div></div><div class="room"></div></article>').join('');Array.from($('lessons').children).forEach((el,i)=>{el.querySelector('.name').textContent=list[i].subject;el.querySelector('.room').textContent=list[i].room});}
render();setInterval(render,15000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});
</script></body></html>
