let label='',value='',status='';if(active>=0){status='ИДЁТ УРОК';label='До звонка';const sec=Math.max(0,Math.ceil((toMinutes(item.end)-t.mins)*60));value=formatCountdown(sec)}else if(upcoming>=0){status=upcoming===0?'СКОРО НАЧАЛО ЗАНЯТИЙ':'ПЕРЕМЕНА';label='До урока';const sec=Math.max(0,Math.ceil((toMinutes(item.start)-t.mins)*60));value=formatCountdown(sec)}else if(ended){status='НА СЕГОДНЯ ВСЁ';label='Хорошего';value='отдыха'}else{status=vacation&&chosen===null?'СЕЙЧАС КАНИКУЛЫ':t.day>4&&chosen===null?'В ПОНЕДЕЛЬНИК':DAYNAMES[view].toUpperCase();label='Первый урок';value=item.start}$('status').textContent=status;$('countLabel').textContent=label;$('count').textContent=value;$('count').classList.toggle('long-count',value.includes(' ч '));const percent=active>=0?Math.max(0,Math.min(100,(t.mins-toMinutes(item.start))/(toMinutes(item.end)-toMinutes(item.start))*100)):0;$('fill').style.width=percent+'%';$('progress').setAttribute('aria-valuenow',String(Math.round(percent)));$('progress').hidden=active<0;
let nextIdx,nextDay=view;if(ended){nextIdx=0;nextDay=(view+1)%5}else{nextIdx=heroIndex+1;if(nextIdx>=list.length){nextIdx=0;nextDay=(view+1)%5}}const next=SCHEDULE[nextDay][nextIdx];$('nextLabel').textContent=nextDay!==view?'Следующий учебный день':'Следующий урок';$('nextTitle').textContent=next.subject;$('nextMeta').textContent=(nextDay!==view?DAYNAMES[nextDay]+' · ':'')+next.start+' · Каб. '+next.room;
const listKey=[view,live,active,list.map(x=>live&&t.mins>=toMinutes(x.end)?'past':'').join(',')].join('|');if(listKey!==lastListKey){lastListKey=listKey;$('lessons').replaceChildren();list.forEach((x,i)=>{const past=live&&t.mins>=toMinutes(x.end);const article=document.createElement('article');article.className='lesson glass'+(i===active?' current':past?' past':'');if(i===active)article.setAttribute('aria-current','true');const num=document.createElement('span');num.className='num';num.textContent=x.num;const body=document.createElement('div');const name=document.createElement('div');name.className='name';name.textContent=x.subject;const hours=document.createElement('div');hours.className='hours';hours.textContent=x.start+'–'+x.end;body.append(name,hours);const room=document.createElement('div');room.className='room';room.textContent=x.room;article.append(num,body,room);$('lessons').append(article)})}}

const reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)');
let previousView=null,previousHero='',lastMotionKey='',motionAnimations=[];
function motion(node,frames,options){if(!node||reduceMotion.matches||typeof node.animate!=='function')return;const a=node.animate(frames,options);motionAnimations.push(a);a.finished.catch(()=>{}).finally(()=>{motionAnimations=motionAnimations.filter(x=>x!==a)});return a}
function movePill(){const nav=$('days'),b=nav.querySelector('.day.active');if(!b)return;nav.style.setProperty('--pill-x',b.offsetLeft+'px');nav.style.setProperty('--pill-width',b.offsetWidth+'px')}
function renderMotion(){const t=nowMinsk(),view=chosen===null?(t.day>4?0:t.day):chosen;const oldView=previousView;const oldHero=previousHero;renderBase();movePill();const subject=$('subject').textContent;const changedDay=oldView!==null&&oldView!==view;const heroChanged=oldHero!==''&&oldHero!==subject;const key=Array.from($('lessons').querySelectorAll('.lesson')).map(x=>x.className).join('|');
 if(changedDay||heroChanged){motionAnimations.forEach(a=>a.cancel());motionAnimations=[];const direction=oldView!==null&&view<oldView?-1:1;motion(document.querySelector('.hero'),[{opacity:.45,transform:'translateX('+direction*15+'px) scale(.99)'},{opacity:1,transform:'translateX(0) scale(1)'}],{duration:360,easing:'cubic-bezier(.22,1,.36,1)'});motion(document.querySelector('.next'),[{opacity:.4,transform:'translateY(7px)'},{opacity:1,transform:'translateY(0)'}],{duration:330,easing:'ease-out'});
 if(changedDay)Array.from($('lessons').querySelectorAll('.lesson')).forEach((row,i)=>motion(row,[{opacity:0,transform:'translateX('+direction*18+'px)'},{opacity:1,transform:'translateX(0)'}],{duration:320,delay:i*28,easing:'cubic-bezier(.22,1,.36,1)',fill:'backwards'}));
 }else if(lastMotionKey&&key!==lastMotionKey){const current=$('lessons').querySelector('.current');motion(current,[{boxShadow:'inset 0 0 0 1px #ffd54f00'},{boxShadow:'inset 0 0 0 2px #edb92599'},{boxShadow:'inset 0 0 0 1px #ffd54f00'}],{duration:900,easing:'ease-out'});Array.from($('lessons').querySelectorAll('.past')).forEach(row=>motion(row,[{opacity:1},{opacity:.65},{opacity:1}],{duration:650}));}
 previousView=view;previousHero=subject;lastMotionKey=key;
}
$('days').addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();chosen=e.key==='Home'?0:e.key==='End'?4:Math.max(0,Math.min(4,(previousView??0)+(e.key==='ArrowRight'?1:-1)));render();$('days').children[chosen].focus()});
window.addEventListener('resize',movePill,{passive:true});
if(window.ResizeObserver)new ResizeObserver(movePill).observe($('days'));
document.querySelectorAll('.hero,.next,.event').forEach(card=>{card.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;const b=card.getBoundingClientRect();card.style.setProperty('--shine-x',((e.clientX-b.left)/b.width*100)+'%');card.style.setProperty('--shine-y',((e.clientY-b.top)/b.height*100)+'%')},{passive:true});card.addEventListener('pointerdown',()=>motion(card,[{transform:'scale(1)'},{transform:'scale(.988)'},{transform:'scale(1)'}],{duration:280,easing:'ease-out'}),{passive:true})});


const activeLight=document.createElement('div');activeLight.className='lesson-highlight';activeLight.setAttribute('aria-hidden','true');
let lightY=null,lightDay=null,suppressLessonClickUntil=0;
function syncHighlight(){const list=$('lessons'),row=list.querySelector('.current');if(!activeLight.isConnected)list.append(activeLight);if(!row){activeLight.style.opacity='0';lightY=null;return}const y=row.offsetTop,h=row.offsetHeight,view=previousView;const detached=activeLight.parentElement!==list;if(detached)list.append(activeLight);if(lightY!==null&&lightDay===view&&Math.abs(y-lightY)>1&&!reduceMotion.matches){activeLight.style.transition='none';activeLight.style.transform='translateY('+lightY+'px)';activeLight.offsetHeight;activeLight.style.transition='';}activeLight.style.opacity='1';activeLight.style.height=h+'px';activeLight.style.transform='translateY('+y+'px)';lightY=y;lightDay=view}
function enhanceLessons(){syncHighlight()}

function render(){renderMotion();enhanceLessons();updateDaySummary();updateMiniLesson()}
const dayContent=$('dayContent');let drag=null,settling=null;
function dragBegin(x,y){if(settling){settling.cancel();settling=null}drag={x,y,lastX:x,time:performance.now(),lock:null,dx:0};dayContent.classList.add('dragging')}
function dragMove(x,y){if(!drag)return false;const dx=x-drag.x,dy=y-drag.y;if(!drag.lock&&Math.max(Math.abs(dx),Math.abs(dy))>9)drag.lock=Math.abs(dx)>Math.abs(dy)*1.2?'x':'y';if(drag.lock!=='x')return false;const view=previousView??0;const edge=view===0&&dx>0||view===4&&dx<0;drag.dx=edge?dx*.22:dx;drag.lastX=x;if(!reduceMotion.matches){dayContent.style.transform='translateX('+drag.dx+'px)';dayContent.style.opacity=String(1-Math.min(Math.abs(drag.dx)/1800,.15))}return true}
function dragEnd(cancel=false){if(!drag)return;const d=drag;drag=null;dayContent.classList.remove('dragging');const elapsed=performance.now()-d.time;const view=previousView??0;const next=Math.max(0,Math.min(4,view+(d.dx<0?1:-1)));const commit=!cancel&&d.lock==='x'&&next!==view&&(Math.abs(d.dx)>Math.min(dayContent.clientWidth*.22,110)||Math.abs(d.dx)>45&&elapsed<280);if(d.lock==='x')suppressLessonClickUntil=Date.now()+400;const from=d.dx;dayContent.style.transform='';dayContent.style.opacity='';if(commit){chosen=next;render();if(!reduceMotion.matches){settling=dayContent.animate([{transform:'translateX('+(d.dx<0?40:-40)+'px)',opacity:.65},{transform:'translateX(0)',opacity:1}],{duration:330,easing:'cubic-bezier(.22,1,.36,1)'});settling.finished.catch(()=>{}).finally(()=>settling=null)}}else if(!reduceMotion.matches&&Math.abs(from)>0){settling=dayContent.animate([{transform:'translateX('+from+'px)'},{transform:'translateX(0)'}],{duration:360,easing:'cubic-bezier(.18,1.2,.35,1)'});settling.finished.catch(()=>{}).finally(()=>settling=null)}}
dayContent.addEventListener('touchstart',e=>{if(e.touches.length!==1){dragEnd(true);return}dragBegin(e.touches[0].clientX,e.touches[0].clientY)},{passive:true});
dayContent.addEventListener('touchmove',e=>{if(e.touches.length!==1){dragEnd(true);return}if(dragMove(e.touches[0].clientX,e.touches[0].clientY)&&e.cancelable)e.preventDefault()},{passive:false});
dayContent.addEventListener('touchend',()=>dragEnd(),{passive:true});dayContent.addEventListener('touchcancel',()=>dragEnd(true),{passive:true});
// Desktop drag uses the same behavior; vertical scrolling stays native on phones.
dayContent.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button===0)dragBegin(e.clientX,e.clientY)});
window.addEventListener('pointermove',e=>{if(e.pointerType==='mouse')dragMove(e.clientX,e.clientY)},{passive:true});window.addEventListener('pointerup',e=>{if(e.pointerType==='mouse')dragEnd()},{passive:true});
window.addEventListener('blur',()=>dragEnd(true));

function updateDaySummary(){const t=nowMinsk(),view=previousView??0,list=SCHEDULE[view];const last=list[list.length-1];const vacation=HOLIDAYS.some(h=>t.iso>=h.start&&t.iso<=h.end);const actual=view===t.day&&!vacation;const total=list.filter(l=>l.num>0).length;let text='';if(vacation&&chosen===null)text='Сейчас каникулы · время отдохнуть';else if(t.day>4&&chosen===null)text='В понедельник '+total+' '+word(total,['урок','урока','уроков'])+' · окончание в '+last.end;else if(actual){const count=list.filter(l=>l.num>0&&t.mins<toMinutes(l.end)).length;const allEnded=t.mins>=toMinutes(last.end);text=allEnded?'На сегодня всё · уроки завершены':count===1?'Остался 1 урок · домой в '+last.end:'Осталось '+count+' '+word(count,['урок','урока','уроков'])+' · домой в '+last.end}else text=total+' '+word(total,['урок','урока','уроков'])+' · окончание в '+last.end;$('daySummary').textContent=text}
function updateThemeButton(){const dark=document.documentElement.dataset.theme==='dark';$('themeToggle').textContent=dark?'☀ Светлая':'☾ Тёмная';$('themeToggle').setAttribute('aria-pressed',String(dark));$('themeToggle').setAttribute('aria-label',dark?'Включить светлую тему':'Включить тёмную тему');document.querySelector('meta[name="theme-color"]').content=dark?'#131923':'#eeede8'}
$('themeToggle').onclick=()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;try{localStorage.setItem('s46-7v-theme',next)}catch(e){}updateThemeButton();if(!reduceMotion.matches)motion(document.querySelector('main'),[{opacity:.82},{opacity:1}],{duration:280,easing:'ease-out'})};updateThemeButton();

let compactMode=false,miniScrollFrame=0;
function updateMiniLesson(){const name=$('subject').textContent,room=$('heroRoom').textContent,label=$('countLabel').textContent,count=$('count').textContent;$('miniSubject').textContent=name;$('miniRoom').textContent=room&&room!=='—'?'Каб. '+room:'7 «В»';$('miniLabel').textContent=label;$('miniCount').textContent=count;$('miniCount').classList.toggle('long',count.includes(' ч ')||count.length>8);$('miniLesson').setAttribute('aria-label',name+', '+(room!=='—'?'кабинет '+room+', ':'')+label.toLowerCase()+' '+count+'. Вернуться к карточке урока')}
function updateCompactMode(){miniScrollFrame=0;const hero=document.querySelector('.hero');if(!hero)return;const panel=$('days').getBoundingClientRect();const bottom=hero.getBoundingClientRect().bottom;const compact=bottom<panel.bottom+6;if(compact===compactMode)return;compactMode=compact;$('floatingControls').classList.toggle('compact',compact);$('miniHolder').setAttribute('aria-hidden',String(!compact));$('miniLesson').tabIndex=compact?0:-1}
function scheduleCompactUpdate(){if(!miniScrollFrame)miniScrollFrame=requestAnimationFrame(updateCompactMode)}
window.addEventListener('scroll',scheduleCompactUpdate,{passive:true});window.addEventListener('resize',scheduleCompactUpdate,{passive:true});
$('miniLesson').onclick=()=>{const hero=document.querySelector('.hero');const offset=$('days').offsetHeight+26;const top=window.scrollY+hero.getBoundingClientRect().top-offset;window.scrollTo({top:Math.max(0,top),behavior:reduceMotion.matches?'instant':'smooth'})};
if(window.ResizeObserver)new ResizeObserver(scheduleCompactUpdate).observe(document.querySelector('.hero'));
requestAnimationFrame(updateCompactMode);

function updateTextSizeButton(){const large=document.documentElement.dataset.textSize==='large';$('textSizeToggle').setAttribute('aria-pressed',String(large));$('textSizeToggle').setAttribute('aria-label',large?'Включить обычный размер текста':'Включить крупный текст');$('textSizeToggle').title=large?'Крупный текст — нажми для обычного':'Обычный текст — нажми для крупного'}
$('textSizeToggle').onclick=()=>{const size=document.documentElement.dataset.textSize==='large'?'normal':'large';document.documentElement.dataset.textSize=size;try{localStorage.setItem('s46-7v-text-size',size)}catch(e){}updateTextSizeButton();requestAnimationFrame(()=>{movePill();syncHighlight();scheduleCompactUpdate()})};updateTextSizeButton();
DAYNAMES.forEach((name,i)=>{const b=document.createElement('button');b.type='button';b.className='day';b.textContent=['ПН','ВТ','СР','ЧТ','ПТ'][i];b.setAttribute('aria-label',name);b.onclick=()=>{chosen=i;render()};$('days').append(b)});$('today').onclick=()=>{chosen=null;render()};render();setInterval(render,1000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});
</script></body></html>
