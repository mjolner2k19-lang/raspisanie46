const $=id=>document.getElementById(id);
let chosen=null,lastCalendar='';
function nowMinsk(){const p=Object.fromEntries(new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Minsk',weekday:'short',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date()).map(x=>[x.type,x.value]));return{day:['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].indexOf(p.weekday),mins:Number(p.hour)*60+Number(p.minute),time:p.hour+':'+p.minute,iso:p.year+'-'+p.month+'-'+p.day}};
const toMinutes=s=>Number(s.slice(0,2))*60+Number(s.slice(3,5));

const days=(a,b)=>Math.round((ms(b)-ms(a))/86400000);

function dayWord(n){if(n%100>=11&&n%100<=14)return'дней';return n%10===1?'день':n%10>=2&&n%10<=4?'дня':'дней'}
function yearWord(n){if(n%100>=11&&n%100<=14)return'лет';return n%10===1?'год':n%10>=2&&n%10<=4?'года':'лет'}
function calendar(t){if(lastCalendar===t.iso)return;lastCalendar=t.iso;const icons={'Осенние':'🍁','Зимние':'❄️','Весенние':'🌷','Летние':'☀️'};let current=HOLIDAYS.find(h=>t.iso>=h.start&&t.iso<=h.end),next=HOLIDAYS.find(h=>t.iso<h.start);let h=current||next;

return current}
function render(){let t=nowMinsk();$('clock').textContent=t.time;calendar(t);const view=chosen===null?(t.day>4?0:t.day):chosen;const actual=view===t.day&&chosen===null&&!HOLIDAYS.some(h=>t.iso>=h.start&&t.iso<=h.end);const week=t.day>4&&chosen===null;const vacation=HOLIDAYS.some(h=>t.iso>=h.start&&t.iso<=h.end)&&chosen===null;const list=SCHEDULE[view];document.body.dataset.day=view;
